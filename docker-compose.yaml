services:
  web:
    image: php:8.5.10-apache-trixie
    ports:
      - 8080:80
    volumes:
      - ${PWD}:/var/www/html:ro
      - ${PWD}/logs/:/var/log/apache2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/index.php"]
      interval: 1m30s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 5s
