version: "3.8"

services:
  web:
    image: php:8.4.18-apache-trixie
    ports:
      - 8080:80
    volumes:
      # rw : enregistrement des profils dans data/profiles (connexion Discord)
      # Utiliser « . » plutôt que ${PWD} : sous Windows, PWD peut monter un dossier vide → 403 sur /
      - .:/var/www/html
